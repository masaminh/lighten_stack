version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      semver-major-days: 7
      semver-minor-days: 1
      semver-patch-days: 1
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # vitest と @vitest/* は互いを exact バージョンで peer 指定しているため、
      # メジャー更新も含めて必ず同じ PR で上げる(dev-dependencies より先に定義する)
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # github-actions は semver-*-days 非対応のため default-days のみ指定する
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
