name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 
      - uses: asdf-vm/actions/install@v4
      - name: Enable Corepack (pin npm to packageManager)
        run: |
          corepack enable
          asdf reshim nodejs
      - name: DEBUG npm version
        run: |
          echo "which npm: $(which npm)"
          echo "npm --version: $(npm --version)"
          echo "which corepack: $(which corepack)"
          echo "corepack --version: $(corepack --version)"
          echo "node --version: $(node --version)"
          cat package.json | grep packageManager
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: build
        run: npm run build
      - name: lint
        run: npm run lint
